name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PWA Builder
        run: npm install -g @pwabuilder/cli

      - name: Create output directory
        run: mkdir -p out/android

      - name: Build APK
        run: pwabuilder build --platform android --location out/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-Reborn-APK
          path: out/android/*.apk
