name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create APK using Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap init --manifest https://hassaion88-tech.github.io/ToolboxReborn/manifest.json
          bubblewrap build --output apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-APK
          path: apk/*.apk
