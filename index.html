<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toolbox Reborn</title>
    
    <!-- ====== هذا السطر مهم لتطبيق أندرويد ====== -->
    <link rel="manifest" href="/ToolboxReborn/manifest.json">
    <!-- ========================================= -->
    
    <style>
        /* ====== التصميم العصري ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: radial-gradient(circle at 20% 30%, #1a1a3e 0%, #0a0a12 100%);
        }
        
        .app-container {
            background: rgba(20, 20, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 28px 24px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.06);
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.08);
        }
        
        .app-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 8px 24px rgba(247, 151, 30, 0.3);
        }
        
        .app-title {
            flex: 1;
        }
        
        .app-title h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .app-title .sub {
            font-size: 12px;
            color: #8888aa;
            letter-spacing: 1px;
        }
        
        .version-badge {
            background: rgba(79, 195, 247, 0.15);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #4fc3f7;
            border: 1px solid rgba(79, 195, 247, 0.1);
        }
        
        .card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s;
        }
        
        .card:active {
            transform: scale(0.98);
        }
        
        .card-label {
            font-size: 11px;
            color: #666688;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        
        .card-value {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
        }
        
        .card-value .highlight {
            color: #ffd200;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 0.3px;
        }
        
        .btn:active {
            transform: scale(0.96);
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #f7971e, #ffd200);
            color: #0f0f1a;
            box-shadow: 0 8px 28px rgba(247, 151, 30, 0.25);
        }
        
        .btn-primary:active {
            box-shadow: 0 4px 14px rgba(247, 151, 30, 0.15);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #ccccee;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .btn-success {
            background: linear-gradient(90deg, #43a047, #66bb6a);
            color: #fff;
            box-shadow: 0 8px 28px rgba(76, 175, 80, 0.2);
        }
        
        .status-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 16px;
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #9999bb;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 6px;
            text-align: center;
            line-height: 1.6;
        }
        
        .status-box.success {
            border-color: rgba(76, 175, 80, 0.2);
            color: #81c784;
        }
        
        .status-box.loading {
            border-color: rgba(255, 215, 0, 0.15);
            color: #ffd54f;
        }
        
        .status-box .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            border-top-color: #ffd200;
            animation: spin 0.7s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .mods-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        
        .mod-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            font-size: 13px;
        }
        
        .mod-item .mod-name {
            display: block;
            font-weight: 500;
            color: #ddd;
        }
        
        .mod-item .mod-ver {
            font-size: 11px;
            color: #4fc3f7;
            background: rgba(79, 195, 247, 0.08);
            padding: 1px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 4px;
        }
        
        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 11px;
            color: #444466;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 14px;
        }
        
        .footer span {
            color: #ffd200;
        }
        
        @media (max-width: 400px) {
            .app-container {
                padding: 18px 14px;
            }
            .app-title h1 {
                font-size: 18px;
            }
            .card-value {
                font-size: 22px;
            }
            .mods-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 8px 28px rgba(247, 151, 30, 0.25);
            }
            50% {
                box-shadow: 0 8px 40px rgba(247, 151, 30, 0.45);
            }
        }
        .btn-primary {
            animation: pulse 2.5s infinite;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ====== HEADER ====== -->
        <div class="header">
            <div class="app-icon">⛏️</div>
            <div class="app-title">
                <h1>Toolbox Reborn</h1>
                <div class="sub">مدير تعديلات ماينكرافت</div>
            </div>
            <div class="version-badge" id="versionBadge">v1.0.0</div>
        </div>

        <!-- ====== الإصدار الحالي ====== -->
        <div class="card">
            <div class="card-label">📦 الإصدار الحالي</div>
            <div class="card-value" id="currentVersionDisplay">1.0.0</div>
        </div>

        <!-- ====== الأزرار ====== -->
        <button class="btn btn-primary" onclick="checkUpdate()">
            🔄 التحقق من تحديث
        </button>

        <button class="btn btn-secondary" onclick="downloadMods()">
            📥 تحميل التعديلات
        </button>

        <!-- ====== حالة التطبيق ====== -->
        <div class="status-box" id="status">
            👋 مرحباً! اضغط للتحقق
        </div>

        <!-- ====== قائمة التعديلات ====== -->
        <div style="margin-top:16px;">
            <div style="font-size:12px; color:#666688; text-align:center; margin-bottom:8px; letter-spacing:1px;">
                📋 التعديلات المتوفرة
            </div>
            <div class="mods-grid" id="modsGrid">
                <div class="mod-item">
                    <span class="mod-name">🔧 Toolbox Core</span>
                    <span class="mod-ver">v2.1.0</span>
                </div>
                <div class="mod-item">
                    <span class="mod-name">⚡ Performance</span>
                    <span class="mod-ver">v1.4.2</span>
                </div>
                <div class="mod-item">
                    <span class="mod-name">🎨 Texture HD</span>
                    <span class="mod-ver">v3.0.1</span>
                </div>
                <div class="mod-item">
                    <span class="mod-name">🛡️ Shield Plus</span>
                    <span class="mod-ver">v1.1.0</span>
                </div>
            </div>
        </div>

        <!-- ====== الفوتر ====== -->
        <div class="footer">
            يدعم <span>ماينكرافت 1.20 – 1.21.4</span> &bull; تحديث تلقائي
        </div>

    </div>

    <script>
        // ===================================================
        //  بيانات التطبيق
        // ===================================================
        const APP = {
            currentVersion: "1.0.0",
            latestVersion: "1.3.0",
            downloadUrl: "https://github.com/hassaion88-tech/ToolboxReborn/releases/latest"
        };

        const MODS_LIST = [
            { name: "🔧 Toolbox Core", version: "2.1.0" },
            { name: "⚡ Performance Booster", version: "1.4.2" },
            { name: "🎨 Texture Pack HD", version: "3.0.1" },
            { name: "🛡️ Shield Plus", version: "1.1.0" },
            { name: "🧪 Experimental", version: "0.9.5" },
            { name: "🌿 Nature Pack", version: "1.2.0" }
        ];

        // ===================================================
        //  الوظائف
        // ===================================================

        function checkUpdate() {
            const status = document.getElementById('status');
            status.className = 'status-box loading';
            status.innerHTML = '<span class="loader"></span> جاري التحقق...';

            setTimeout(() => {
                if (APP.currentVersion !== APP.latestVersion) {
                    status.className = 'status-box success';
                    status.innerHTML = `
                        ✅ <strong>تحديث جديد!</strong><br>
                        الإصدار ${APP.latestVersion} متاح<br>
                        <button onclick="installUpdate()" style="
                            margin-top:10px;
                            background:#ffd200;
                            color:#0f0f1a;
                            border:none;
                            padding:8px 28px;
                            border-radius:14px;
                            font-weight:600;
                            cursor:pointer;
                            font-size:14px;
                        ">⬇️ تثبيت التحديث</button>
                    `;
                    document.getElementById('currentVersionDisplay').textContent = APP.latestVersion;
                    document.getElementById('versionBadge').textContent = 'v' + APP.latestVersion;
                } else {
                    status.className = 'status-box';
                    status.innerHTML = '✅ أنت تستخدم أحدث إصدار!';
                }
            }, 1500);
        }

        function installUpdate() {
            const status = document.getElementById('status');
            status.className = 'status-box loading';
            status.innerHTML = '<span class="loader"></span> جاري تحميل التحديث...';

            setTimeout(() => {
                status.className = 'status-box success';
                status.innerHTML = `
                    ✅ تم تحميل التحديث!<br>
                    <span style="font-size:12px; color:#8888aa;">
                        سيتم التثبيت عند إعادة التشغيل
                    </span><br>
                    <button onclick="restartApp()" style="
                        margin-top:10px;
                        background:#43a047;
                        color:#fff;
                        border:none;
                        padding:8px 28px;
                        border-radius:14px;
                        font-weight:600;
                        cursor:pointer;
                        font-size:14px;
                    ">🔄 إعادة تشغيل</button>
                `;
            }, 2000);
        }

        function restartApp() {
            document.getElementById('status').className = 'status-box';
            document.getElementById('status').innerHTML = '🔄 إعادة تشغيل...';
            setTimeout(() => location.reload(), 600);
        }

        function downloadMods() {
            const status = document.getElementById('status');
            status.className = 'status-box loading';
            status.innerHTML = '<span class="loader"></span> جاري تحميل التعديلات...';

            setTimeout(() => {
                let grid = document.getElementById('modsGrid');
                let html = '';
                MODS_LIST.forEach(mod => {
                    html += `
                        <div class="mod-item">
                            <span class="mod-name">${mod.name}</span>
                            <span class="mod-ver">${mod.version}</span>
                        </div>
                    `;
                });
                grid.innerHTML = html;

                status.className = 'status-box success';
                status.innerHTML = `✅ تم تحميل ${MODS_LIST.length} تعديل بنجاح!`;
            }, 1800);
        }

        window.onload = function() {
            document.getElementById('status').innerHTML = '👋 مرحباً! اضغط على "التحقق من تحديث"';
            setTimeout(() => {
                const status = document.getElementById('status');
                if (status.innerHTML.includes('مرحباً')) {
                    status.innerHTML = '💡 يوجد تحديث جديد! اضغط على الزر أعلاه.';
                    status.style.borderColor = 'rgba(255,215,0,0.2)';
                }
            }, 4000);
        };
    </script>

</body>
</html>
